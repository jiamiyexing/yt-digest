name: YouTube Digest
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz
          pip install openai requests

      # 核心新增：在云端启动一个专门生成 PO Token 的本地服务
      - name: Start bgutil-provider
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider

      - name: Run digest
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_COOKIES_RAW: ${{ secrets.YOUTUBE_COOKIES_RAW }} 
        run: python main.py

      - name: Commit seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json"
          git push
