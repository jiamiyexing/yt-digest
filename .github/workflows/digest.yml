name: YouTube Digest
on:
  schedule:
    - cron: "30 2 * * *"   # UTC 02:30 = 北京时间 10:30
    - cron: "0 3 * * *"    # UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "yt-dlp[default]" openai requests

      - name: Run digest
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: python main.py

      - name: Commit seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json"
          git push
