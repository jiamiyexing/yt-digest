name: YouTube Digest
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. 安装 Deno 环境（YouTube 最新风控要求）
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      # 2. 安装 Python 依赖，并装上 PO Token 插件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz
          pip install openai requests bgutil-ytdlp-pot-provider

      # 3. 启动本地 PO Token 提供器
      - name: Start bgutil-provider
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider

      # 4. 运行脚本
      - name: Run digest
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_COOKIES_RAW: ${{ secrets.YOUTUBE_COOKIES_RAW }} 
        run: python main.py

      # 5. 保存记录（即使没新视频，也不会报错红叉了）
      - name: Commit seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f seen.json ]; then
            git add seen.json
            git diff --staged --quiet || git commit -m "Update seen.json"
            git push
          else
            echo "没有新的处理记录，跳过 commit"
          fi
